[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nycroads"
version = "0.1.0"
description = "Data pipeline, geometry generator and test tooling for the NYC Drivable Roads MSFS 2024 scenery add-on"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "shapely>=2.0",
  "pyproj>=3.5",
  "networkx>=3.0",
  "pygltflib>=1.16",
  "requests>=2.28",
  "scipy>=1.10",
  "pyarrow>=14",
]

[project.optional-dependencies]
dem = ["rasterio>=1.3", "laspy[lazrs]>=2.4"]   # GeoTIFF DEM sampling, lidar (LAZ / EPT)
sim = ["SimConnect>=0.4.26"]     # Windows only: telemetry recorder + recovery (unverified on MSFS 2024)
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
nycroads = "nycroads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
